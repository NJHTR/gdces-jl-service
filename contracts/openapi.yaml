openapi: 3.0.3

info:
  title: 监理 AI 服务 · 业务契约
  version: 1.0.0
  description: |
    广东建设工程监理有限公司 · 监理 AI 服务对外接口。

    ## 所有权标注
    每个接口都标了 `x-owner`：
    - `biz`   —— 业务域（文书/项目/成员/审计/规范/统计）。**未来抽成 Java 服务**，
                 真值和规则都在这里：状态机、字段校验、权限。
    - `agent` —— Agent 运行时（任务编排、执行过程、记忆）。**留在 Python**。
    - `infra` —— 基础设施（鉴权、上传、blob、地理、天气）。

    ## 拆分的三条规矩
    1. **一张表只有一个写者**。业务表（doc/project/photo/audit）只有 biz 写；
       会话表（task/message.trace）只有 agent 写。
    2. **Agent 只提议不决定**。要建文书就调 `POST /api/v1/docs`，
       校验和状态流转留在 biz 侧。
    3. **工作区文件由 agent 写**。数据库是真值，文件是产出物，用 doc_id 对齐。

    ## 通用约定
    - 所有响应统一包一层 `{code, message?, data}`
    - `code = 0` 表示成功；HTTP 状态码同步表达语义
    - 需要登录的接口带 `Authorization: Bearer <token>`
    - 项目级接口都会校验"这个人是不是这个项目的成员"

servers:
  - url: http://127.0.0.1:8081
    description: 本机开发（经 SSH 隧道）

tags:
  - name: 鉴权
    x-owner: infra
  - name: 项目
    x-owner: biz
  - name: 文书
    x-owner: biz
  - name: 影像
    x-owner: biz
  - name: 对话
    x-owner: agent
  - name: 任务
    x-owner: agent
  - name: 记忆
    x-owner: agent
  - name: 多模态
    x-owner: agent
  - name: 规范
    x-owner: biz
  - name: 审计与统计
    x-owner: biz
  - name: 基础设施
    x-owner: infra

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- 鉴权
  /api/v1/auth/wx-login:
    post:
      tags: [鉴权]
      x-owner: infra
      summary: 小程序登录
      description: 用 wx.login 拿到的 code 换 token。开发期 code 不校验。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: wx.login 返回的 code }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeSession' }

  /api/v1/auth/wx-phone:
    post:
      tags: [鉴权]
      x-owner: infra
      summary: 用微信手机号换手机号（需要 getPhoneNumber 的 code）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { description: 成功 }

  /api/v1/auth/logout:
    post:
      tags: [鉴权]
      x-owner: infra
      summary: 退出登录（令牌失效）
      responses:
        '200': { description: 成功 }

  /api/v1/me:
    get:
      tags: [鉴权]
      x-owner: infra
      summary: 当前登录用户
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }

  # ---------------------------------------------------------------- 项目
  /api/v1/projects:
    get:
      tags: [项目]
      x-owner: biz
      summary: 项目列表（切换面板用）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProjectBrief' }

  /api/v1/project:
    get:
      tags: [项目]
      x-owner: biz
      summary: 单个项目
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: 成功 }
    put:
      tags: [项目]
      x-owner: biz
      summary: 新建或更新项目（只传要改的字段，不会清空其他字段）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200': { description: 成功 }

  /api/v1/projects/{projectId}/render-memory:
    post:
      tags: [项目, 记忆]
      x-owner: biz
      summary: 重新渲染项目记忆文件（项目记忆变更后自动调用）
      parameters:
        - $ref: '#/components/parameters/ProjectIdInPath'
      responses:
        '200': { description: 成功 }

  # ---------------------------------------------------------------- 文书
  /api/v1/docs/validate:
    post:
      tags: [biz]
      x-owner: biz
      summary: 校验文书字段是否齐全
      description: |
        只校验不落库。规则来自服务端 schemas/<类型>.json，不是代码里写死的 if。
        占位词（待补/待定/未知…）算作缺。agent 出稿前用 validate_doc 工具自查。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, description: 文书类型 }
                fields: { type: object, description: 字段键值 }
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      missing: { type: array, items: { type: string } }
                      placeholder: { type: array, items: { type: string } }
                      unknown: { type: array, items: { type: string } }
                      note: { type: string }
                      kind: { type: string }
                      schemas: { type: array, items: { type: string } }
        '400': { description: 缺 kind }
  /api/v1/docs:
    get:
      tags: [文书]
      x-owner: biz
      summary: 文书列表
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/DocBrief' }
                          total: { type: integer }
    post:
      tags: [文书]
      x-owner: biz
      summary: 新建文书（Agent 也走这个接口，不直接写库）
      description: |
        业务校验在这里：必填项、状态初值（有空的字段就是「待补」）。
        Agent 侧的 create_doc_draft 工具改造后会调用它。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocCreate' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Doc' }

  /api/v1/docs/{docId}:
    get:
      tags: [文书]
      x-owner: biz
      summary: 文书详情
      parameters:
        - $ref: '#/components/parameters/DocId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Doc' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [文书]
      x-owner: biz
      summary: 保存文书字段
      description: |
        只能改本文书已有的字段。改完自动重算状态：
        还有空字段 → 待补；全填完 → 待签。
        保存后会写回工作区并 git 提交（提交信息带「依据:」行，仓库钩子强制）。
      parameters:
        - $ref: '#/components/parameters/DocId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: object
                  additionalProperties: { type: string }
                  example: { 签发人: 李工 }
                state:
                  type: string
                  enum: [待补, 待签, 已签, 作废]
                  description: 不传则按字段自动推导
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer }
                          state: { type: string }
                          missing:
                            type: array
                            items: { type: string }
                          fields:
                            type: object
                            additionalProperties: { type: string }

  # ---------------------------------------------------------------- 影像
  /api/v1/photos:
    get:
      tags: [影像]
      x-owner: biz
      summary: 影像列表
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: 成功 }

  /api/v1/photos/{photoId}:
    patch:
      tags: [影像]
      x-owner: biz
      summary: 改影像的部位描述
      parameters:
        - name: photoId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place]
              properties:
                place: { type: string, example: 4#楼东侧外架 }
      responses:
        '200': { description: 成功 }

  # 真实照片派生图（task-9）：只读 photo/blob，产物落 data/assets（origin=derived），
  # 不写 photo/doc/records/memory/knowledge；返回可直接挂 answer.blocks 的 image_ref 块。
  /api/v1/photos/annotate:
    post:
      tags: [影像]
      x-owner: agent
      summary: 在真实照片上标注框/编号/标签 → 派生图资产 + image_ref block
      description: |
        源图必须是本项目 photo（按 photoId 读 blob）；输出 PNG 落 data/assets，
        asset(origin=derived, producer=annotate, sourceRefs=["photo:<id>"], model=pillow, prompt_hash, status=committed)。
        角标「派生图·基于现场照片」；boxes 使用原图像素坐标，越界会裁剪，全部越界返回 400。
        Agent 侧工具：`jl-tool annotate_photo`（同一实现；模型需先用 search_photos 拿真实 photoId，
        产物自动写入本轮 `.agent/blocks.json` 并挂到 answer.blocks；不伪造现场照片）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoAnnotateRequest' }
      responses:
        '200':
          description: '成功：{asset, block, fallbackText}'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PhotoCraftResult' }
        '400': { description: 参数/坐标不合法 }
        '403': { description: 非项目成员 }
        '404': { description: 照片不存在/不属于该项目 }
        '413': { description: 原图或结果过大 }

  /api/v1/photos/compare:
    post:
      tags: [影像]
      x-owner: agent
      summary: 整改前后对比拼版（两张真实照片）→ 派生图资产 + image_ref block
      description: |
        两张源图都必须是本项目 photo；两侧带来源水印（现场照片#id/日期/部位）与「整改前/整改后」标签，
        角标「派生图·基于现场照片」。同一张照片做对比返回 400（不伪造现场）。
        Agent 侧工具：`jl-tool compare_photos`（同一实现；模型先用 search_photos 拿两个真实 photoId，
        产物自动挂到 answer.blocks）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoCompareRequest' }
      responses:
        '200':
          description: '成功：{asset, block, fallbackText}'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PhotoCraftResult' }
        '400': { description: 参数不合法/同一张照片 }
        '403': { description: 非项目成员 }
        '404': { description: 照片不存在/不属于该项目 }
        '413': { description: 原图或结果过大 }

  /api/v1/upload:
    post:
      tags: [基础设施]
      x-owner: infra
      summary: 上传文件（走 multipart，按 sha256 去重）
      description: |
        ⚠️ 迁移注意：目前落本地 data/blobs/。
        上多实例前必须改成对象存储（MinIO/OSS），否则换机器就 404。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                projectId: { type: string }
      responses:
        '200': { description: 成功 }

  /api/v1/blobs/{sha}:
    get:
      tags: [基础设施]
      x-owner: infra
      summary: 取文件内容
      parameters:
        - name: sha
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 二进制内容 }

  /api/v1/geo/reverse:
    get:
      tags: [基础设施]
      x-owner: infra
      summary: 逆地理编码（坐标 → 地址）
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number }
        - name: lng
          in: query
          required: true
          schema: { type: number }
      responses:
        '200': { description: 成功 }

  /api/v1/weather:
    get:
      tags: [基础设施]
      x-owner: infra
      summary: 天气（监理日志要记气温）
      parameters:
        - name: city
          in: query
          schema: { type: string }
      responses:
        '200': { description: 成功 }

  # ---------------------------------------------------------------- 对话
  /api/v1/asr:
    post:
      tags: [agent]
      x-owner: agent
      summary: 语音转文字
      description: |
        把已上传的音频转成文字。前端流程：先 /upload 拿 sha，再调这里换文字。
        内部走阿里云百炼 qwen-audio-3.0-asr-flash；静音音频返回空文本而不是错误。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blob]
              properties:
                blob:
                  type: string
                  description: 上传后拿到的 sha256
      responses:
        '200':
          description: 转写结果（text 可能为空字符串，表示没识别到语音）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      text: { type: string }
                      note: { type: string, description: 没识别到时的说明 }
        '400': { description: 缺 blob }
        '503': { description: 识别服务不可用 }
  /api/v1/chat:
    post:
      tags: [对话]
      x-owner: agent
      summary: 发一句话给 AI（异步，返回 taskId）
      description: |
        同一个用户在同一个项目内**串行**：前一条没跑完，这一条会排队。
        不同用户之间并行（受 MAX_CONCURRENT 限制）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, text]
              properties:
                projectId: { type: string, example: yun-gu-3qi }
                userId: { type: integer }
                clientId:
                  type: string
                  description: 客户端生成的幂等键，重发同一个 clientId 不会产生两个任务
                text: { type: string }
                capabilities:
                  type: array
                  description: |
                    新客户端 opt-in。带 "answer.blocks"（或 answer.blocks.v1）时，
                    回答里才附多模态块；不带 → blocks=[]，旧客户端行为不变。
                  items: { type: string }
                  example: ["answer.blocks"]
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          taskId: { type: integer }
                          status: { type: string }

  /api/v1/bootstrap:
    get:
      tags: [对话]
      x-owner: agent
      summary: 首屏聚合（项目 + 消息 + 记录 + 文书 + 记忆）
      description: 小程序打开时只调这一个接口，减少往返。
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: 成功 }

  /api/v1/messages:
    get:
      tags: [对话]
      x-owner: agent
      summary: 增量拉消息（断线重连用）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: after
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200': { description: 成功 }

  # ---------------------------------------------------------------- 任务
  /api/v1/tasks:
    get:
      tags: [任务]
      x-owner: agent
      summary: 任务列表
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: 成功 }

  /api/v1/tasks/{taskId}:
    get:
      tags: [任务]
      x-owner: agent
      summary: 任务详情（前端轮询这个看进度；支持 trace 增量）
      description: |
        traceVersion=2 时返回 run + 增量 events：只返回 seq>after_seq 的事件（升序）。
        旧字段（status/progress/messages 等）全部保留，旧客户端忽略新字段即可。
        run.status 取值 succeeded/partial/failed/cancelled/queued/running；
        顶层 status 仍是旧值（done/failed/...），旧客户端不受影响。
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: after_seq
          in: query
          description: 只返回 seq 大于该值的事件（增量轮询用；省略=从头）
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Task' }

  /api/v1/tasks/{taskId}/trace:
    get:
      tags: [任务]
      x-owner: agent
      summary: 历史全量 trace（事件账本；支持 after_seq 增量）
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: after_seq
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: '成功：{traceVersion, run, lastSeq, events[]}'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TraceView' }

  /api/v1/tasks/{taskId}/events/{seq}/detail:
    get:
      tags: [任务]
      x-owner: agent
      summary: 单条事件完整输出（大输出按需读；脱敏；权限校验）
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: seq
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: '成功：{seq,kind,name,status,error,truncated,outputBytes,output,source}'
        '403': { description: 无权查看该事件详情（private/admin） }
        '404': { description: 任务/事件不存在 }

  /api/v1/tasks/{taskId}/cancel:
    post:
      tags: [任务]
      x-owner: agent
      summary: 取消任务
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { description: 成功 }
        '409': { description: 任务已结束，不能取消 }

  /api/v1/tasks/{taskId}/retry:
    post:
      tags: [任务]
      x-owner: agent
      summary: 重试失败的任务
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { description: 成功 }

  # ---------------------------------------------------------------- 记忆
  # 记忆分两个域（详见 docs/MEMORY-ACCEPTANCE.md）：
  #   memory 表 = 唯一账本；memory_candidate = 待确认候选；文件（MEMORY.md / projects/... / memory_summary.md / rules.md）= 渲染视图。
  # 写入审批：项目级规矩必须走 rule_proposal 或 memory_candidate(scope=project) 的提案，由总监/owner/admin 确认；
  #          个人记忆（scope=user）只能本人读写。
  /api/v1/memories:
    get:
      tags: [记忆]
      x-owner: agent
      summary: 记忆列表（memory 表；文件视图另见 memory_summary/MEMORY.md/rules.md）
      description: |
        scope=user 时只能查本人（ownerId 必须是当前 token 用户，否则 403；演示模式匿名放行）。
        scope=project 时需要项目成员。
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [user, project] }
        - name: ownerId
          in: query
          required: true
          description: scope=user 时是 user_id；scope=project 时是 project_id
          schema: { type: string }
        - name: projectId
          in: query
          description: scope=user 时用于筛「本项目」的个人记忆
          schema: { type: string }
      responses:
        '200': { description: 成功 }
        '403': { description: 查看他人个人记忆 / 非项目成员 }
    post:
      tags: [记忆]
      x-owner: agent
      summary: 新增记忆（scope=project 时只创建待确认提案，不直接生效）
      description: |
        scope=user：登录用户只能写自己（ownerId 必须等于 token 用户）。
        scope=project：不写 memory，只插入 rule_proposal(pending)；总监/owner 确认后才写 memory + 重渲染 rules.md。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryCreate' }
      responses:
        '200': { description: '成功；scope=project 时返回 {id,status:"pending",proposal:true}' }
        '403': { description: 替他人写个人记忆 / 非项目成员 }

  /api/v1/memories/recall:
    get:
      tags: [记忆]
      x-owner: agent
      summary: 按关键词找记忆（项目规矩 + 我的记忆 + 我在这个项目的习惯），命中 hits+1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: q
          in: query
          required: true
          schema: { type: string, example: 整改回复 }
        - name: userId
          in: query
          description: 只允许本人（传他人 userId → 403；匿名演示放行）
          schema: { type: string }
      responses:
        '200': { description: 成功 }
        '403': { description: 查询他人记忆 }

  /api/v1/memories/{memoryId}:
    patch:
      tags: [记忆]
      x-owner: agent
      summary: 改记忆（个人记忆仅本人；项目记忆仅总监/owner/admin）
      parameters:
        - name: memoryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 512 }
                status:
                  type: integer
                  description: 1=生效 0=停用（历史文档曾写 active/disabled，真实实现按真值转 1/0）
                  example: 1
      responses:
        '200': { description: 成功 }
        '403': { description: 非本人 / 非总监 }
    delete:
      tags: [记忆]
      x-owner: agent
      summary: 删记忆（个人记忆仅本人；项目记忆仅总监/owner/admin）
      parameters:
        - name: memoryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 成功 }
        '403': { description: 非本人 / 非总监 }

  /api/v1/metrics/memory:
    get:
      tags: [记忆]
      x-owner: biz
      summary: 记忆指标（主动写/复用/撤销率/提案确认率）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: 成功 }

  # ---------------------------------------------------------------- 项目规矩提案
  /api/v1/rule-proposals:
    get:
      tags: [记忆]
      x-owner: biz
      summary: 项目规矩提案列表（默认 pending）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, rejected], default: pending }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RuleProposal' }
    post:
      tags: [记忆]
      x-owner: biz
      summary: 提交项目规矩提案（pending；不写 memory / rules.md）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleProposalCreate' }
      responses:
        '200': { description: '成功：{id,status:"pending",duplicated?}' }

  /api/v1/rule-proposals/{proposalId}/accept:
    post:
      tags: [记忆]
      x-owner: biz
      summary: 确认项目规矩提案（仅总监/owner/admin；确认才写 memory + 重渲染 rules.md + audit）
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200': { description: '成功：{id,status:"accepted",memoryId,rendered}' }
        '403': { description: 普通成员 / 非项目成员 }
        '409': { description: 已处理过 }

  /api/v1/rule-proposals/{proposalId}/reject:
    post:
      tags: [记忆]
      x-owner: biz
      summary: 否决项目规矩提案（只改状态，不写 memory / 文件）
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200': { description: '成功：{id,status:"rejected"}' }
        '409': { description: 已处理过 }

  # ---------------------------------------------------------------- 记忆候选（Phase1）
  # 候选只是"待确认"：pending 永远不写 memory、不渲染文件、不进提示；accept 才落 memory。
  # scope：user=跨项目个人 / project_user=个人×本项目 / project=项目共享（仅总监确认）。
  /api/v1/memory-candidates:
    get:
      tags: [记忆]
      x-owner: agent
      summary: 记忆候选列表（默认 pending）
      description: user/project_user 只能看本人；project 需项目成员。
      parameters:
        - name: projectId
          in: query
          schema: { type: string }
        - name: userId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, rejected], default: pending }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MemoryCandidate' }
    post:
      tags: [记忆]
      x-owner: agent
      summary: 新建记忆候选（服务端/Agent 写入；只写 pending，不写 memory/rules.md）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryCandidateCreate' }
      responses:
        '200': { description: '成功：{id,status:"pending"}；重复 pending 返回原 id + duplicated:true' }
        '400': { description: scope/text/projectId 不合法 }
        '403': { description: 替他人提交个人候选 / 非项目成员 }

  /api/v1/memory-candidates/{candidateId}/accept:
    post:
      tags: [记忆]
      x-owner: agent
      summary: 接受候选（user/project_user 本人；project 仅总监/owner/admin）
      description: |
        user → memory(scope=user, project_id=NULL) + 重渲染 MEMORY.md/memory_summary.md；
        project_user → memory(scope=user, project_id=<pid>) + 重渲染个人×项目文件；
        project → memory(scope=project, source=confirmed) + 重渲染 records/rules.md + audit。
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      responses:
        '200': { description: '成功：{id,status:"accepted",memoryId,rendered?,summary?}' }
        '403': { description: 非本人 / 普通成员接受项目候选 }
        '404': { description: 候选不存在 }
        '409': { description: 已处理过 }

  /api/v1/memory-candidates/{candidateId}/reject:
    post:
      tags: [记忆]
      x-owner: agent
      summary: 拒绝候选（只改状态；不写 memory / 文件；写 audit）
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      responses:
        '200': { description: '成功：{id,status:"rejected"}' }
        '403': { description: 非本人 }
        '404': { description: 候选不存在 }
        '409': { description: 已处理过 }

  # ---------------------------------------------------------------- 多模态资产（Phase1 MVP）
  # 资产只落 data/assets/<pid>/<assetId>；绝不写 blobs/photos/docs/records/memory/knowledge。
  # 内容端点既支持 Bearer，也支持短签 URL（小程序 <image> 不能带 header）。
  /api/v1/assets:
    post:
      tags: [多模态]
      x-owner: agent
      summary: 签发/上传生成物或派生资产（字节进 data/assets；模型不输出字节）
      description: |
        三种 body：
          1) 原始字节 + Content-Type（image/jpeg|png|webp、audio/mpeg|wav、pdf、txt、docx），
             query 带 projectId/origin/producer/caption/taskId/messageId/sourceRefs；
          2) multipart/form-data（file + 同名字段），给工具/小程序上传用；
          3) application/json {"projectId","photoId","caption"...} = 真实照片引用
             （origin=uploaded，sourceRefs=["photo:<id>"]，不复制证据、不写 photo 表）。
        图片会被重编码去 EXIF/GPS；staged 24h，挂到回答后 committed。
      parameters:
        - name: projectId
          in: query
          schema: { type: string }
        - name: origin
          in: query
          schema: { type: string, enum: [uploaded, derived, generated], default: generated }
        - name: caption
          in: query
          schema: { type: string }
        - name: taskId
          in: query
          schema: { type: integer }
        - name: messageId
          in: query
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                projectId: { type: string }
                origin: { type: string }
                caption: { type: string }
          application/json:
            schema: { $ref: '#/components/schemas/AssetPhotoRef' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Asset' }
        '400': { description: mime 不在白名单 / 内容与 mime 不符 / 参数不合法 }
        '403': { description: 非项目成员 }
        '413': { description: 超过大小上限 }

  /api/v1/assets/{assetId}:
    get:
      tags: [多模态]
      x-owner: agent
      summary: 资产元数据（含短签 url）
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Asset' }
        '404': { description: 不存在/已删除 }
    delete:
      tags: [多模态]
      x-owner: agent
      summary: 软删除资产（status=deleted；字节移除，审计保留）
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200': { description: 成功 }
        '404': { description: 不存在/已删除 }

  /api/v1/assets/{assetId}/content:
    get:
      tags: [多模态]
      x-owner: agent
      security: []
      summary: 资产内容（短签 URL；小程序 <image> 可直接加载，不需要 Bearer）
      description: |
        两种访问方式：
          · 短签：`/api/v1/assets/<id>/content?e=<exp>&s=<sig>[&dl=1]`，
            e/s 由服务端签发，默认 10 分钟有效；<image> 直接可用。
          · Bearer：没有短签时走正常项目权限校验。
        响应头带 nosniff / Cache-Control；文件下载加 dl=1。
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: e
          in: query
          schema: { type: integer, description: 过期时间戳（短签） }
        - name: s
          in: query
          schema: { type: string, description: HMAC 短签 }
        - name: dl
          in: query
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: 文件字节
          content:
            image/*: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '403': { description: 无权限（无有效短签且非项目成员） }
        '404': { description: 不存在/已删除 }

  /api/v1/assets/{assetId}/commit:
    post:
      tags: [多模态]
      x-owner: agent
      summary: 提交 staged 资产（挂 message/task；generated/derived 90 天后过期）
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId: { type: integer }
                taskId: { type: integer }
      responses:
        '200': { description: 成功 }
        '404': { description: 不存在/已删除 }
        '409': { description: 状态不可提交 }

  # ---------------------------------------------------------------- 规范
  /api/v1/standards:
    get:
      tags: [规范]
      x-owner: biz
      summary: 规范检索
      parameters:
        - name: q
          in: query
          schema: { type: string, example: 连墙件 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200': { description: 成功 }

  /api/v1/standard:
    get:
      tags: [规范]
      x-owner: biz
      summary: 按标准号 + 条号取条文原文（点引用脚注用）
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, example: JGJ 130-2011 }
        - name: clause
          in: query
          required: true
          schema: { type: string, example: '6.4.3' }
      responses:
        '200': { description: 成功 }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- 审计与统计
  /api/v1/audit:
    get:
      tags: [审计与统计]
      x-owner: biz
      summary: 审计日志
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200': { description: 成功 }

  /api/v1/stats:
    get:
      tags: [审计与统计]
      x-owner: biz
      summary: 项目统计
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          docs: { type: integer }
                          pending: { type: integer, description: 待补文书数 }
                          messages: { type: integer }
                          photos: { type: integer }
                          tasksDone: { type: integer }

  # ---------------------------------------------------------------- 成员
  /api/v1/members:
    get:
      tags: [项目]
      x-owner: biz
      summary: 项目成员列表
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: 成功 }
    post:
      tags: [项目]
      x-owner: biz
      summary: 加成员
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, userId]
              properties:
                projectId: { type: string }
                userId: { type: integer }
                role: { type: string, enum: [owner, engineer, viewer], default: engineer }
      responses:
        '200': { description: 成功 }

  /healthz:
    get:
      tags: [基础设施]
      x-owner: infra
      security: []
      summary: 健康检查
      responses:
        '200': { description: '{ok, engine}' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 登录拿到的 64 位 token

  parameters:
    ProjectId:
      name: projectId
      in: query
      required: true
      schema: { type: string, example: yun-gu-3qi }
    ProjectIdInPath:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    DocId:
      name: docId
      in: path
      required: true
      schema: { type: integer }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: integer }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: integer }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: integer }
    AssetId:
      name: assetId
      in: path
      required: true
      description: 26 位 ULID
      schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }

  responses:
    NotFound:
      description: 不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Envelope:
      type: object
      required: [code]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: {}

    EnvelopeSession:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                token: { type: string }
                user: { $ref: '#/components/schemas/User' }

    Error:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }

    ProjectBrief:
      type: object
      properties:
        id: { type: string, example: yun-gu-3qi }
        name: { type: string, example: 云谷智造园 · 3期 }
        code: { type: string, nullable: true }
        addr: { type: string, nullable: true }
        builder: { type: string, description: 建设单位 }
        msgs: { type: integer, description: 消息数，切换面板用来区分 }

    ProjectInput:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        addr: { type: string }
        builder: { type: string }

    DocBrief:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, example: 监理通知单 }
        obj: { type: string, example: 4#楼东侧外架 }
        state: { type: string, enum: [待补, 待签, 已签, 作废] }
        created_at: { type: string }

    Doc:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: string }
        kind: { type: string }
        obj: { type: string }
        state: { type: string, enum: [待补, 待签, 已签, 作废] }
        fields:
          type: object
          additionalProperties: { type: string }
          description: 文书字段。值为空的字段就是「待补」。
        missing:
          type: array
          items: { type: string }
          description: 值为空的字段名（前端做行内标注用）
        bases:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              clause: { type: string }
        path: { type: string, description: 工作区相对路径 }
        commit: { type: string, description: git 提交短号 }
        createdAt: { type: string }
        updatedAt: { type: string }

    DocCreate:
      type: object
      required: [projectId, kind]
      properties:
        projectId: { type: string }
        kind: { type: string, example: 监理通知单 }
        obj: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        bases:
          type: array
          items:
            type: object
        taskId:
          type: integer
          description: 由哪个任务产生的（Agent 调用时传）

    Task:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: string }
        userId: { type: integer }
        status:
          type: string
          enum: [queued, running, done, failed, cancelled]
        queueAhead:
          type: integer
          description: 同一个人前面还有几条在跑
        progress:
          type: array
          description: 执行中的步骤（前端轮询画进度）
          items:
            type: object
            properties:
              label: { type: string }
              tool: { type: string }
              state: { type: string, enum: [running, done] }
              secs: { type: number }
        artifact:
          type: object
          nullable: true
          description: 这一轮产出的文书（按 task.doc_id 精确绑定）
          properties:
            id: { type: integer }
            name: { type: string }
            state: { type: string }
            commit: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        blocks:
          type: array
          description: |
            多模态 answer.blocks v1（_pollTask 可直接用；也可从 messages[].answer.blocks 取）。
            客户端没在 chat.body.capabilities 里 opt-in 时为空数组。
          items: { $ref: '#/components/schemas/AnswerBlock' }
        # ---------------- 最终态 trace（additive；旧客户端忽略）
        traceVersion:
          type: integer
          enum: [1, 2]
          description: 1=旧扁平 trace；2=task_event 事件账本
        run: { $ref: '#/components/schemas/TraceRun' }
        lastSeq:
          type: integer
          description: 当前任务最大事件序号（增量轮询游标）
        events:
          type: array
          description: seq>after_seq 的事件，按 seq 升序
          items: { $ref: '#/components/schemas/TaskEvent' }

    TraceRun:
      type: object
      properties:
        taskId: { type: integer }
        status:
          type: string
          enum: [queued, running, succeeded, partial, failed, cancelled]
          description: run 终态（旧 task.status=done 在投影层映射为 succeeded）
        startedAt: { type: string, nullable: true }
        endedAt: { type: string, nullable: true }
        summary: { type: string }
        stepCount: { type: integer }

    TraceView:
      type: object
      properties:
        traceVersion: { type: integer, enum: [1, 2] }
        run: { $ref: '#/components/schemas/TraceRun' }
        lastSeq: { type: integer }
        events:
          type: array
          items: { $ref: '#/components/schemas/TaskEvent' }

    TaskEvent:
      type: object
      description: |
        append-only 执行事件。seq 同 task 单调无空洞，**不原地改已有行**：
        步骤开始时追加 running 事件；完成/失败时再追加一条新事件（新 seq、同 stepId、
        parentSeq=起始事件 seq、status=终态、输出/错误在终态事件上）。
        客户端按 stepId（或 (stepId,seq)）upsert：后到的终态覆盖 running。
        大输出只给 preview，完整内容走 /tasks/{id}/events/{seq}/detail。
      properties:
        seq: { type: integer }
        stepId: { type: string, nullable: true }
        parentSeq:
          type: integer
          nullable: true
          description: 完成事件指向起始事件 seq；子智能体/嵌套步骤也用它指父 step
        kind:
          type: string
          enum: [plan, tool, file_read, file_write, image_read, subagent, artifact,
                 validation, note, error, status]
        phase:
          type: string
          nullable: true
          enum: [understand, plan, gather, act, finish]
        status:
          type: string
          enum: [pending, running, succeeded, failed, retrying, skipped, cancelled]
        name: { type: string, description: 中文动作名 }
        summary: { type: string, nullable: true }
        inputPreview: { type: string, nullable: true, description: 参数摘要（≤4KB，脱敏） }
        outputPreview: { type: string, nullable: true, description: 输出前 4KB（脱敏） }
        outputRef: { type: string, nullable: true, description: data/trace/<task>/<seq>.json.gz }
        outputBytes: { type: integer, nullable: true }
        truncated: { type: boolean }
        error: { type: string, nullable: true }
        attempt: { type: integer }
        retryOfSeq: { type: integer, nullable: true }
        startedAt: { type: string, nullable: true }
        endedAt: { type: string, nullable: true }
        visibility: { type: string, enum: [project, private, admin] }
        artifacts:
          type: array
          description: |
            只读产物引用（L3 缩略图/跳转用）：图片给现签 url，文书给 docId；
            只引用不复制证据。detail 端点同样返回该字段。
          items:
            type: object
            properties:
              type: { type: string, enum: [image, doc, file, asset] }
              assetId: { type: string, nullable: true }
              docId:
                oneOf: [{ type: integer }, { type: string }]
                nullable: true
              photoId: { type: integer, nullable: true }
              url: { type: string, nullable: true, description: 图片短签（仅 image 且资产存在时） }
              name: { type: string, nullable: true }
              mime: { type: string, nullable: true }
              bytes: { type: integer, nullable: true }

    Message:
      type: object
      properties:
        id: { type: integer }
        role: { type: string, enum: [user, assistant] }
        text: { type: string, description: 已经清洗过的话（无路径/markdown/提交号） }
        ms: { type: integer }
        msLabel: { type: string, example: 2 分 51 秒 }
        traceSum: { type: string, example: 调了 查规范、写文书 }
        trace:
          type: array
          description: |
            旧格式执行时间线（note/cmd/shell）。v2 任务仍保留该字段（旧客户端不变）；
            新客户端请读 taskId/traceVersion/events。
          items:
            type: object
            properties:
              kind: { type: string, enum: [note, cmd, shell] }
              text: { type: string }
              cmd: { type: string }
              output: { type: string }
              secs: { type: number }
              ok: { type: boolean }
        taskId:
          type: integer
          nullable: true
          description: 该消息所属 run（task）；user 消息为空
        traceVersion:
          type: integer
          nullable: true
          enum: [1, 2]
          description: 2=该 run 有事件账本；历史消息的 v2 视图走 events
        events:
          type: array
          nullable: true
          description: |
            v2 历史回放：该 run 的完整事件数组（append-only，含 running 与末态完成事件；
            客户端按 stepId upsert）。旧客户端忽略；message.trace 仍是旧格式。
          items: { $ref: '#/components/schemas/TaskEvent' }
        cites:
          type: array
          description: 引用（从工具真实输出里提取，不是模型编的）
          items:
            type: object
            properties:
              code: { type: string }
              clause: { type: string }
              title: { type: string }
        answer:
          type: object
          description: 行内标注所需数据
          properties:
            rich:
              type: array
              description: 片段数组，s ∈ t/b/n/r/g/br
              items:
                type: object
                properties:
                  s: { type: string }
                  v: { type: string }
                  code: { type: string }
                  clause: { type: string }
            gaps:
              type: array
              items: { type: string }
            text: { type: string }

    # ---------------- 记忆（Phase1 候选 / 旧 /memories / 项目规矩提案）
    MemoryCreate:
      type: object
      required: [scope, ownerId, text]
      properties:
        scope: { type: string, enum: [user, project] }
        ownerId: { type: string, description: scope=user 时是 user_id；scope=project 时是 project_id }
        projectId: { type: string, description: scope=user 时表示「本项目习惯」；跨项目不传 }
        text: { type: string, maxLength: 512 }
        source: { type: string, example: manual }
        sourceRef: { type: string }

    MemoryCandidateCreate:
      type: object
      required: [projectId, userId, scope, text]
      properties:
        projectId: { type: string, example: test-sandbox }
        userId: { type: string, example: '99999' }
        scope:
          type: string
          enum: [user, project_user, project]
          description: user=跨项目个人 / project_user=个人×本项目 / project=项目共享
        text: { type: string, maxLength: 512 }
        evidence: { type: string, description: 用户原话 / 字段改动摘录 }
        sourceTaskId: { type: integer }
        sourceMessageId: { type: integer }

    MemoryCandidate:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: string }
        userId: { type: string }
        scope: { type: string, enum: [user, project_user, project] }
        scopeLabel: { type: string, example: 本项目习惯 }
        text: { type: string }
        evidence: { type: string, nullable: true }
        sourceTaskId: { type: integer, nullable: true }
        sourceMessageId: { type: integer, nullable: true }
        status: { type: string, enum: [pending, accepted, rejected] }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, nullable: true }
        createdAt: { type: string }

    RuleProposalCreate:
      type: object
      required: [projectId, text]
      properties:
        projectId: { type: string }
        text: { type: string, maxLength: 512 }
        source: { type: string, default: agent, example: agent }
        sourceRef: { type: string }
        evidence: { type: string }

    RuleProposal:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: string }
        user_id: { type: string, nullable: true }
        text: { type: string }
        source: { type: string }
        source_ref: { type: string, nullable: true }
        evidence: { type: string, nullable: true }
        status: { type: string, enum: [pending, accepted, rejected] }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, nullable: true }
        created_at: { type: string }

    # ---------------- 多模态资产 / answer.blocks v1
    AssetPhotoRef:
      type: object
      required: [projectId, photoId]
      properties:
        projectId: { type: string }
        photoId: { type: integer, description: 真实照片 id（引用，不复制证据） }
        caption: { type: string }
        taskId: { type: integer }
        messageId: { type: integer }
        producer: { type: string, default: photo_ref }

    Asset:
      type: object
      properties:
        assetId: { type: string, description: 26 位 ULID }
        projectId: { type: string }
        kind: { type: string, enum: [image, audio, file] }
        mime: { type: string, example: image/jpeg }
        size: { type: integer }
        sha256: { type: string, description: 去元数据后的字节 sha }
        origin: { type: string, enum: [uploaded, derived, generated] }
        status: { type: string, enum: [staged, committed, quarantined, deleted] }
        caption: { type: string, nullable: true }
        sourceRefs:
          type: array
          items: { type: string }
          description: '如 ["photo:55"] / ["asset:<ulid>"]'
        url:
          type: string
          description: 短签内容 URL（小程序 <image> 可直接加载，不需要 Bearer）
          example: /api/v1/assets/01J.../content?e=1760000000&s=abc
        downloadUrl:
          type: string
          description: file 类型的短期下载 URL（dl=1）
        createdAt: { type: string }
        expiresAt: { type: string, nullable: true }

    AnswerBlock:
      type: object
      required: [type]
      description: |
        answer.blocks v1。硬规则：模型/工具只给引用（assetId/photoId/docId），
        url 由服务端签发；data:base64、本地绝对路径、外部 http(s) 链接整块丢弃，
        文字 fallback 始终保留（answer.text 不变）。未知/他项目 assetId 丢弃。
      properties:
        type: { type: string, enum: [text, image_ref, file_ref, card] }
        text: { type: string, description: type=text 时 }
        assetId: { type: string, description: type=image_ref/file_ref 时 }
        caption: { type: string }
        origin:
          type: string
          enum: [uploaded, derived, generated]
          description: 缺失时前端显示中性「附件」
        mime: { type: string }
        name: { type: string, description: file_ref 的文件名 }
        url:
          type: string
          description: image_ref/file_ref 的短签 URL；card 为只读 deep link
        downloadUrl: { type: string, description: file_ref 的短期下载 URL }
        sourceRefs:
          type: array
          items: { type: string }
          description: '如 ["photo:55"]'
        docId: { type: integer, description: type=card 时，只读文书 id }
        title: { type: string, description: type=card 时 }
        data:
          type: object
          additionalProperties: true
          description: type=card 时的只读展示数据（不含外链/本地路径/base64）
        actions:
          type: array
          description: card 只读动作；只允许 open / readonly，不新增写 API
          items:
            type: object
            properties:
              type: { type: string, enum: [open, readonly] }

    # ---------------- 真实照片派生图（task-9）
    PhotoAnnotateRequest:
      type: object
      required: [projectId, photoId]
      properties:
        projectId: { type: string }
        photoId: { type: integer, description: 本项目真实照片 id（只读源图） }
        boxes:
          type: array
          maxItems: 20
          description: 原图像素坐标；越界裁剪，全部越界返回 400
          items:
            type: object
            required: [x, y, w, h]
            properties:
              x: { type: number }
              y: { type: number }
              w: { type: number }
              h: { type: number }
              label: { type: string, maxLength: 24, example: 裂缝 }
        caption: { type: string, description: 底部说明；外链/本地路径会被清空 }
        taskId: { type: integer }
        messageId: { type: integer }

    PhotoCompareRequest:
      type: object
      required: [projectId, beforePhotoId, afterPhotoId]
      properties:
        projectId: { type: string }
        beforePhotoId: { type: integer, description: 整改前现场照片 id }
        afterPhotoId: { type: integer, description: 整改后现场照片 id（不能与 before 相同） }
        title: { type: string, example: 4#楼东侧外架整改前后 }
        beforeLabel: { type: string, default: 整改前 }
        afterLabel: { type: string, default: 整改后 }
        taskId: { type: integer }
        messageId: { type: integer }

    PhotoCraftResult:
      type: object
      properties:
        asset: { $ref: '#/components/schemas/Asset' }
        block:
          allOf:
            - $ref: '#/components/schemas/AnswerBlock'
            - description: 可直接放进 answer.blocks 的 image_ref 块
        fallbackText: { type: string, description: 失败/降级时用的文字 }
