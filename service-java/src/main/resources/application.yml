server:
  port: 8082

spring:
  application:
    name: jl-biz
  datasource:
    url: jdbc:mysql://127.0.0.1:3309/jl?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: jl
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

logging:
  level:
    root: INFO
    com.gdces.jl: DEBUG
